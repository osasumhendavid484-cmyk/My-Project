<!-- Book Now Section -->
<section id="book-now" class="py-5 bg-light">

  <div class="container">

    <!-- Heading -->
    <div class="text-center mb-5">
      <h2 class="fw-bold text-uppercase">Book Your Appointment</h2>
      <p class="text-muted">
        Relax, refresh, and feel beautiful. Book your preferred spa treatment today.
      </p>
    </div>

    <div class="row justify-content-center">

      <div class="col-lg-8">

        <div class="card shadow border-0 rounded-4">
          <div class="card-body p-4 p-md-5">

            <form>

              <div class="row g-4">

                <!-- Full Name -->
                <div class="col-md-6">
                  <label for="name" class="form-label fw-semibold">
                    Full Name
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="Enter your full name"
                    required
                  >
                </div>

                <!-- Phone Number -->
                <div class="col-md-6">
                  <label for="phone" class="form-label fw-semibold">
                    Phone Number
                  </label>
                  <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                  >
                </div>

                <!-- Email -->
                <div class="col-md-6">
                  <label for="email" class="form-label fw-semibold">
                    Email Address
                  </label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email"
                  >
                </div>

                <!-- Service -->
                <div class="col-md-6">
                  <label for="service" class="form-label fw-semibold">
                    Select Service
                  </label>

                  <select class="form-select" id="service" required>
                    <option value="" selected disabled>
                      Choose a service
                    </option>
                    <option>Manicure</option>
                    <option>Pedicure</option>
                    <option>Lash Extension</option>
                    <option>Facial</option>
                    <option>Massage</option>
                    <option>Wig Installation</option>
                  </select>
                </div>

                <!-- Date -->
                <div class="col-md-6">
                  <label for="date" class="form-label fw-semibold">
                    Appointment Date
                  </label>

                  <input
                    type="date"
                    class="form-control"
                    id="date"
                    required
                  >
                </div>

                <!-- Time -->
                <div class="col-md-6">
                  <label for="time" class="form-label fw-semibold">
                    Preferred Time
                  </label>

                  <input
                    type="time"
                    class="form-control"
                    id="time"
                    required
                  >
                </div>

                <!-- Message -->
                <div class="col-12">
                  <label for="message" class="form-label fw-semibold">
                    Additional Message
                  </label>

                  <textarea
                    class="form-control"
                    id="message"
                    rows="4"
                    placeholder="Tell us anything we should know..."
                  ></textarea>
                </div>

                <!-- Button -->
                <div class="col-12 text-center">

                  <button
                    type="submit"
                    class="btn book-btn px-5 py-3 rounded-pill fw-bold"
                  >
                    <i class="bi bi-calendar-check me-2"></i>
                    Book Now
                  </button>

                </div>

              </div>

            </form>

          </div>
        </div>

      </div>

    </div>

  </div>

</section>
